      let lastColorStep = null;
      tl.to(colorDriver, {

        duration: 0.45,
        ease: "none",
        onUpdate: () => {
          const state = colorDriver.t >= colorSteps[1].t ? colorSteps[1] : colorSteps[0];
          if (state !== lastColorStep) {
            swatch.style.backgroundColor = state.value;

            lastColorStep = state;

      tl.set(layerSource, { opacity: 0 }, 7.57);

      tl.to(cursor, { scale: 1, duration: 0.18, ease: "power2.out" }, 8.48);

      tl.fromTo(portrait, { opacity: 0, y: 14, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.32, ease: "power3.out", immediateRender: false }, 9.25);
      tl.to(artboard, { scaleX: 0.72, scaleY: 0.94, x: 0, y: 0, duration: 0.58, ease: "power2.inOut" }, 9.25);
      tl.fromTo(landscape, { opacity: 0, y: 14, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.32, ease: "power3.out", immediateRender: false }, 10.0);

      tl.fromTo(square, { opacity: 0, y: 14, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.32, ease: "power3.out", immediateRender: false }, 10.75);
      tl.to(artboard, { scaleX: 0.82, scaleY: 0.82, x: 0, y: 18, duration: 0.58, ease: "power2.inOut" }, 10.75);
      tl.to(cursor, { x: 1492, y: 676, duration: 0.72, ease: "power2.inOut" }, 11.25);

      tl.addLabel("04-human-in-loop-mobile-resolve", 12.2);
      tl.to(artboard, { scaleX: 0.5, scaleY: 0.94, x: 0, y: 0, duration: 0.72, ease: "power2.inOut" }, "04-human-in-loop-mobile-resolve");
      tl.to(inspector, { scaleX: 0.72, scaleY: 0.1, x: -390, duration: 0.62, ease: "power2.inOut" }, "04-human-in-loop-mobile-resolve");

      tl.to(finalHold, { value: 1, duration: 1.8, ease: "none" }, 13.2);
    })();
