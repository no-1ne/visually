  <script>
    (() => {
      const frame = document.querySelector('[data-composition-id="07-design-together"]');
      if (!frame || !window.gsap) return;

      const tl = gsap.timeline({ paused: true });
      const tools = frame.querySelectorAll('[class~="07-design-together-tool-pill"]');
      const vPath = frame.querySelector('[id="07-design-together-v-path"]');
      const letters = frame.querySelectorAll('[class~="07-design-together-letter"]');
      const underline = frame.querySelector('[class~="07-design-together-underline"]');
      const rings = frame.querySelector('[class~="07-design-together-rings"]');
      const tagline = frame.querySelector('[class~="07-design-together-tagline"]');
      const cta = frame.querySelector('[class~="07-design-together-cta"]');
      const ctaText = frame.querySelector('[class~="07-design-together-cta-text"]');

      const vLength = vPath.getTotalLength();
      vPath.style.strokeDasharray = String(vLength);
      vPath.style.strokeDashoffset = String(vLength);

      tools.forEach((tool, index) => {
        const targetX = Number(tool.dataset.targetX);
        const targetY = Number(tool.dataset.targetY);
        tl.fromTo(
          tool,
          {
            xPercent: -50,
            yPercent: -50,
            x: targetX * 0.16,
            y: targetY * 0.16,
            scale: 1.06,
            opacity: 1
          },
          {
            x: targetX,
            y: targetY,
            scale: 0.92,
            opacity: 0,
            duration: 1.65,
            ease: 'power3.out'
          },
          0.08 + index * 0.055
        );
      });

      tl.fromTo(
        vPath,
        { strokeDashoffset: vLength, opacity: 0.22 },
        { strokeDashoffset: 0, opacity: 1, duration: 0.82, ease: 'power2.out' },
        2.0
      );

      letters.forEach((letter, index) => {
        tl.fromTo(
          letter,
          { x: -34, y: 10, scale: 0.94, opacity: 0 },
          { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.68, ease: 'back.out(1.45)' },
          2.56 + index * 0.105
        );
      });

      tl.fromTo(
        underline,
        { scaleX: 0, opacity: 0.4 },
        { scaleX: 1, opacity: 1, duration: 0.62, ease: 'power2.out' },
        3.36
      );

      tl.fromTo(
        rings,
        { scale: 0.88, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.92, ease: 'power2.out' },
        4.1
      );

      tl.fromTo(
        tagline,
        { clipPath: 'inset(0 100% 0 0)', opacity: 0.35 },
        { clipPath: 'inset(0 0% 0 0)', opacity: 1, duration: 0.82, ease: 'power2.out' },
        4.28
      );

      tl.fromTo(
        cta,
        { clipPath: 'inset(0 50% 0 50% round 100px)', scale: 0.96, opacity: 0 },
        { clipPath: 'inset(0 0% 0 0% round 100px)', scale: 1, opacity: 1, duration: 0.72, ease: 'power3.out' },
        5.4
      );

      tl.fromTo(
        ctaText,
        { clipPath: 'inset(0 100% 0 0)', opacity: 0 },
        { clipPath: 'inset(0 0% 0 0)', opacity: 1, duration: 0.62, ease: 'power2.out' },
        5.66
      );

      window.__timelines = window.__timelines || {};
      window.__timelines['07-design-together'] = tl;
