      const rows = [1, 2, 3].map((n) => pick(`03-ask-act-verify-receipt-${n}`));
      const checks = [1, 2, 3].map((n) => pick(`03-ask-act-verify-check-${n}`));

      checks.forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
      });

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["03-ask-act-verify"] = tl;

      tl.set([templateHighlight, copyHighlight, targetRing], { opacity: 0, scale: 0 }, 0);

            typed.textContent = prompt.substring(0, count);
            caret.style.background = progress > 0.72 ? "#7657ff" : "#4d35b5";
            const activelyTyping = typeClock.t >= 0.18 && typeClock.t <= 2.92;
