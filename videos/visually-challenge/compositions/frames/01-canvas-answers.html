  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="01-canvas-answers"]');
      const world = document.getElementById('01-canvas-answers-world');
      const focusTarget = document.getElementById('01-canvas-answers-focus-target');
      const posterLayer = document.getElementById('01-canvas-answers-poster-layer');
      const typeLayer = document.getElementById('01-canvas-answers-type-layer');
      const questionWords = Array.from(root.querySelectorAll('[class~="01-canvas-answers-question-word"]'));
      const selectionPath = document.getElementById('01-canvas-answers-selection-path');
      const selectionHandles = Array.from(root.querySelectorAll('[class~="01-canvas-answers-selection-handle"]'));
      const payoff = document.getElementById('01-canvas-answers-payoff');
      const payoffWords = Array.from(root.querySelectorAll('[class~="01-canvas-answers-payoff-word"]'));

      const rootRect = root.getBoundingClientRect();
      const targetRect = focusTarget.getBoundingClientRect();
      const renderedScaleX = rootRect.width / 1920 || 1;
      const renderedScaleY = rootRect.height / 1080 || 1;
      const targetOffsetX = ((targetRect.left + targetRect.width / 2) - (rootRect.left + rootRect.width / 2)) / renderedScaleX;
      const targetOffsetY = ((targetRect.top + targetRect.height / 2) - (rootRect.top + rootRect.height / 2)) / renderedScaleY;

      const OPEN_SCALE = 3.05;
      const cam = {
        scale: OPEN_SCALE,
        x: -targetOffsetX * OPEN_SCALE,
        y: -targetOffsetY * OPEN_SCALE,
      };

      function applyCamera() {
        world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
      }
      applyCamera();

      const outlineLength = selectionPath.getTotalLength();
      selectionPath.style.strokeDasharray = `${outlineLength}`;
      selectionPath.style.strokeDashoffset = `${outlineLength}`;

      const QUESTION_CONTENT = [
        { text: 'WHAT', hold: 0.12 },
        { text: 'IF', hold: 0.1 },
        { text: '?', hold: 0.18 },
      ];
      const QUESTION_BASE_DURATION = 0.16;
      const QUESTION_SEC_PER_CHAR = 0.025;
      let questionCursor = 0.16;
      const QUESTION_TIMELINE = QUESTION_CONTENT.map((entry, index) => {
        const duration = QUESTION_BASE_DURATION + entry.text.length * QUESTION_SEC_PER_CHAR + entry.hold;
        const start = questionCursor;
        questionCursor += duration;
        return { ...entry, index, start, end: questionCursor };
      });

      const tl = gsap.timeline({ paused: true });

      QUESTION_TIMELINE.forEach((entry) => {
        tl.fromTo(
          questionWords[entry.index],
          { opacity: 0, y: 24, filter: 'blur(12px)' },
          { opacity: 1, y: 0, filter: 'blur(0px)', duration: Math.min(0.42, entry.end - entry.start + 0.12), ease: 'power3.out' },
          entry.start,
        );
      });

      tl.fromTo(
        posterLayer,
        { x: -5, y: 4, scale: 1.008 },
        { x: 0, y: 0, scale: 1, duration: 2.2, ease: 'power2.out' },
        0,
      );
      tl.fromTo(
        typeLayer,
        { x: -11, y: 8, scale: 1.016 },
        { x: 0, y: 0, scale: 1, duration: 2.35, ease: 'power3.out' },
        0,
      );

      tl.to(
        cam,
        {
          scale: 1,
          x: 0,
          y: 0,
          duration: 3.3,
          ease: 'expo.out',
          onUpdate: applyCamera,
        },
        2.5,
      );

      tl.fromTo(
        payoff,
        { opacity: 0, y: 18, filter: 'blur(10px)' },
        { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.42, ease: 'power2.out' },
        5.72,
      );

      tl.to(
        selectionPath,
        { strokeDashoffset: 0, duration: 0.8, ease: 'power2.out' },
        5.86,
      );
      tl.fromTo(
        selectionHandles,
        { opacity: 0, scale: 0.7, transformOrigin: 'center center' },
        { opacity: 1, scale: 1, duration: 0.3, stagger: 0.07, ease: 'power2.out' },
        6.48,
      );

      const PAYOFF_TIMINGS = {
        help: { start: 0.15, end: 0.35 },
        finish: { start: 0.5, end: 0.75 },
        it: { start: 0.9, end: 1.1 },
      };
      const ATTACK_DUR = 0.12;
      const RELEASE = 0.32;
      const REST_LEVEL = 0.1;
      const MAX_BLUR = 36;
      const MAX_SCALE_BOOST = 0.18;
      const REST_RGB = { r: 154, g: 154, b: 154 };
      const ACTIVE_RGB = { r: 10, g: 10, b: 10 };
      const BRAND_RGB = { r: 118, g: 87, b: 255 };

      function envelope(time, start, end) {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
        const releaseEnd = end + RELEASE;
        if (time < releaseEnd) return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);
        return REST_LEVEL;
      }

      function lerpChannel(a, b, amount) {
        return Math.round(a + (b - a) * amount);
      }

      function colorAt(amount, isBrand) {
        const target = isBrand ? BRAND_RGB : ACTIVE_RGB;
        return `rgb(${lerpChannel(REST_RGB.r, target.r, amount)}, ${lerpChannel(REST_RGB.g, target.g, amount)}, ${lerpChannel(REST_RGB.b, target.b, amount)})`;
      }

      const payoffDriver = { t: 0 };
      tl.to(
        payoffDriver,
        {
          t: 2.2,
          duration: 2.2,
          ease: 'none',
          onUpdate: () => {
            payoffWords.forEach((word) => {
              const timing = PAYOFF_TIMINGS[word.dataset.word];
              const amount = envelope(payoffDriver.t, timing.start, timing.end);
              word.style.color = colorAt(amount, word.classList.contains('01-canvas-answers-payoff-brand'));
              word.style.textShadow = `0 0 ${MAX_BLUR * amount}px rgba(118, 87, 255, ${0.52 * amount})`;
              word.style.transform = `scale(${1 + MAX_SCALE_BOOST * amount})`;
            });
          },
        },
        5.8,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines['01-canvas-answers'] = tl;
    })();
  </script>
