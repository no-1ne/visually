            y: targetY * 0.68,
            scale: 0.94,
            opacity: 0

            yPercent: -50,
            x: targetX,
            y: targetY,
            scale: 1,
            opacity: 1,
            duration: 1.08,
            ease: "power3.out"

          cardTimes[index]

      });

      flowPaths.forEach((path, index) => {
        tl.fromTo(
          path,
          { strokeDasharray: 100, strokeDashoffset: 100, opacity: 0.2 },
          { strokeDashoffset: 0, opacity: 1, duration: 0.82, ease: "power2.out" },

      flowNodes.forEach((node, index) => {

          node,
          { scale: 0.4, opacity: 0, transformOrigin: "50% 50%" },
          { scale: 1, opacity: 1, duration: 0.36, ease: "back.out(1.7)" },
