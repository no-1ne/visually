  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="06-creative-range"]');
      const q = (selector) => root.querySelector(selector);
      const qa = (selector) => Array.from(root.querySelectorAll(selector));
      const crop = q('[class~="06-creative-range-crop"]');
      const templateStat = q('[class~="06-creative-range-template-stat"]');
      const capabilityCards = qa('[class~="06-creative-range-capability"]');
      const webmcp = q('[class~="06-creative-range-webmcp"]');
      const drawPaths = qa('[class~="06-creative-range-check-ring"], [class~="06-creative-range-check-path"]');
      const payoff = q('[class~="06-creative-range-payoff"]');

      drawPaths.forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
      });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["06-creative-range"] = tl;

      tl.set(payoff, { opacity: 0, clipPath: "inset(0 100% 0 0)" }, 0);
      tl.set(webmcp, { opacity: 0 }, 0);

      tl.fromTo(
        crop,
        { x: -34, opacity: 0.5, scale: 0.988 },
        { x: 0, opacity: 1, scale: 1, duration: 0.82, ease: "power3.out" },
        0.02
      );
      tl.fromTo(
        templateStat,
        { x: -20, y: 10, scale: 0.96, opacity: 0 },
        { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.82, ease: "power3.out" },
        0.32
      );

      const capabilityTimes = [2.22, 2.88, 3.54, 4.20, 4.88, 5.56, 6.26, 7.02];
      capabilityCards.forEach((card, index) => {
        const targetX = Number(card.dataset.targetX);
        const targetY = Number(card.dataset.targetY);
        tl.fromTo(
          card,
          {
            xPercent: -50,
            yPercent: -50,
            x: targetX * 0.72,
            y: targetY * 0.72,
            scale: 0.94,
            opacity: 0
          },
          {
            xPercent: -50,
            yPercent: -50,
            x: targetX,
            y: targetY,
            scale: 1,
            opacity: 1,
            duration: 1.0,
            ease: "power3.out"
          },
          capabilityTimes[index]
        );
      });

      tl.fromTo(
        webmcp,
        { y: 26, scale: 0.965, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.86, ease: "power3.out", immediateRender: false },
        7.82
      );
      tl.to(
        drawPaths[0],
        { strokeDashoffset: 0, duration: 0.72, ease: "power2.out" },
        8.42
      );
      tl.to(
        drawPaths[1],
        { strokeDashoffset: 0, duration: 0.52, ease: "power2.out" },
        8.96
      );

      tl.fromTo(
        payoff,
        { opacity: 0, clipPath: "inset(0 100% 0 0)" },
        { opacity: 1, clipPath: "inset(0 0% 0 0)", duration: 0.9, ease: "power2.out", immediateRender: false },
        10.22
